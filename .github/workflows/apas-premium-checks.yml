name: APAS Premium Report Checks

on:
  push:
    branches: ["main", "git-status", "premium-audit-*"]
  pull_request:
    branches: ["main", "git-status"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run build
